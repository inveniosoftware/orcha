[project]
name = "orcha-backend"
version = "0.6.0"
description = "backend for orcha ai extraction"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "typer>=0.25.1",
    "fastapi-limiter>=0.2.0",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "nanoid>=2.0.0",
    "pdfplumber>=0.11.9",
    "pymupdf>=1.27.2.3",
    "pymupdf4llm>=1.27.2.3",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-ai>=1.94.0",
    "python-multipart>=0.0.28",
    "sqlalchemy>=2.0.49",
    "sqlmodel>=0.0.38",
    "temporalio>=1.27.0",
    "PyJWT>=2.12.1",
    "cryptography>=48.0.0",
    "alembic>=1.18.4",
    "idutils>=1.6.1",
]

[project.scripts]
orcha = "app.cli.main:app"

[project.optional-dependencies]
langfuse = [
    "langfuse>=4.7.0,<4.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "ruff>=0.15.12",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-mock>=3.15.1",
    "ty>=0.0.35",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
]
ignore = [
    "D100",  # missing docstring in public module
    "D104",  # missing docstring in public package
    "D106",  # missing docstring in public nested class
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["app", "tests"]

[tool.uv]
exclude-newer = "3 days"